name: Build & Release YT-AZS V12

on:
  push:
    tags:
      - 'v*'
      - 'V*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Windows Executable
        shell: cmd
        run: |
          build_ytazs.bat nopause

      - name: Package Windows Binary
        shell: pwsh
        run: |
          Compress-Archive -Path dist/YT-AZS -DestinationPath YT-AZS-Windows-V12.0.zip

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: YT-AZS-Windows-V12.0
          path: YT-AZS-Windows-V12.0.zip

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk ffmpeg libxcb-cursor0

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Linux Binary
        run: |
          chmod +x build_linux.sh
          # Build without creating new venv
          CTK_PATH=$(python -c "import customtkinter, os; print(os.path.dirname(customtkinter.__file__))")
          PIL_PATH=$(python -c "import PIL, os; print(os.path.dirname(PIL.__file__))")
          pyinstaller --noconfirm --onedir --windowed --name "YT-AZS" \
            --add-data "logo_white_PNG.png:." \
            --add-data "logo_black_PNG.png:." \
            --add-data "YT-AZS.ico:." \
            --add-data "$CTK_PATH:customtkinter" \
            --add-data "$PIL_PATH:PIL" \
            --hidden-import "download_engines" \
            --hidden-import "web_server" \
            --hidden-import "customtkinter" \
            --hidden-import "PIL._tkinter_finder" \
            --hidden-import "PIL.Image" \
            --hidden-import "yt_dlp" \
            --collect-all "customtkinter" \
            --collect-all "yt_dlp" \
            YT-AZS.py
          chmod +x dist/YT-AZS/YT-AZS
          tar -czvf YT-AZS-Linux-V12.0.tar.gz -C dist YT-AZS

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: YT-AZS-Linux-V12.0
          path: YT-AZS-Linux-V12.0.tar.gz

  release:
    needs: [build-windows, build-linux]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: YT-AZS-Windows-V12.0

      - name: Download Linux Artifact
        uses: actions/download-artifact@v4
        with:
          name: YT-AZS-Linux-V12.0

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            YT-AZS-Windows-V12.0.zip
            YT-AZS-Linux-V12.0.tar.gz
          name: "YT AZS V12.0"
          draft: false
          prerelease: false
          generate_release_notes: true
